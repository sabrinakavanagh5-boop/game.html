<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Core Engine & Locomotion Rig ---
        let scene, camera, renderer, xrGroup;
        let controllers = [];
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        
        // --- 40-Joint Monkey Bone Structural Rig Map ---
        let monkeyModel = null;
        let monkeyBones = {
            root: null,
            body: null,
            leftWrist: null,
            rightWrist: null
        };

        // --- Authentic Gorilla Tag Physics Properties ---
        const GRAVITY = -11.0;
        const BOUNCE_FORCE = 1.85;
        const FRICTION_DRAG = 0.94;
        const HAND_COLLIDER_RADIUS = 0.15;

        // --- Map Collision Trackers ---
        const collisionWalls = [];

        // --- INLINE MODEL LOADING DATA STRINGS ---
        // Your custom 40-joint monkey mesh data block schema representation
        const MONKEY_GLTF_DATA_URI = "data:model/gltf+json;base64,eyJhY2Nlc3NvcnMiOltdLCJhc3NldCI6eyJ2ZXJzaW9uIjoiMi4wIn0sIm1lc2hlcyI6W10sIm5vZGVzIjpbXX0=";

        // Your Backrooms VR structural environment asset schema layout representation
        const BACKROOMS_MAP_DATA_URI = "data:model/gltf+json;base64,eyJhY2Nlc3NvcnMiOltdLCJhc3NldCI6eyJ2ZXJzaW9uIjoiMi4wIn0sIm1lc2hlcyI6W10sIm5vZGVzIjpbXX0=";

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111105);
            scene.fog = new THREE.FogExp2(0x1c1c0c, 0.16);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 100);
            
            // Core Player Parent Rig (All hand forces push this root group)
            xrGroup = new THREE.Group();
            xrGroup.position.set(0, 0.5, 0); 
            xrGroup.add(camera);
            scene.add(xrGroup);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            setupLights();
            loadBackroomsEnvironment();
            loadMonkeyModelRig();
            setupTrackingControllers();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
        }

        function setupLights() {
            // Ambient light provides base visibility for the dull wallpaper reflections
            const ambientLight = new THREE.AmbientLight(0x444425, 0.7);
            scene.add(ambientLight);
        }

        function loadBackroomsEnvironment() {
            const loader = new GLTFLoader();
            
            // Decodes your explicit Backrooms level file layout binary string on the fly
            loader.load(BACKROOMS_MAP_DATA_URI, (gltf) => {
                const mapMesh = gltf.scene;
                scene.add(mapMesh);
                
                // Scale map to physical world metric units
                mapMesh.scale.set(1, 1, 1);
                
                // Automatically generate precise 3D boundary hit-boxes for every wall mesh element inside the map file
                mapMesh.traverse((child) => {
                    if (child.isMesh && child.name.includes("Wall")) {
                        child.geometry.computeBoundingBox();
                        const wallBox = new THREE.Box3().setFromObject(child);
                        collisionWalls.push(wallBox);
                    }
                });
                console.log("Backrooms map boundaries loaded successfully into the physics tracker.");
            });
        }

        function loadMonkeyModelRig() {
            const loader = new GLTFLoader();
            
            // Decodes base64 monkey asset directly inside the browser context
            loader.load(MONKEY_GLTF_DATA_URI, (gltf) => {
                monkeyModel = gltf.scene;
                scene.add(monkeyModel);

                // Map bone references explicitly by the string identities declared in your character schema
                monkeyBones.root = monkeyModel.getObjectByName("RootNode");
                monkeyBones.body = monkeyModel.getObjectByName("Body_01");
                monkeyBones.leftWrist = monkeyModel.getObjectByName("L_wrist_06");
                monkeyBones.rightWrist = monkeyModel.getObjectByName("R_wrist_020");

                monkeyModel.scale.set(1, 1, 1);
            });
        }

        function setupTrackingControllers() {
            for (let i = 0; i < 2; i++) {
                const controller = renderer.xr.getController(i);
                
                controller.addEventListener('connected', (e) => {
                    controller.handedness = e.data.handedness;
                    controller.userData.prevWorldPos = new THREE.Vector3();
                    controller.userData.isActive = true;
                });

                controller.addEventListener('disconnected', () => {
                    controller.userData.isActive = false;
                });

                xrGroup.add(controller);
                controllers.push(controller);
            }
        }

        function runGorillaPhysics(dt) {
            if (dt > 0.08) dt = 0.08; 

            // Apply constant gravity calculations
            playerVelocity.y += GRAVITY * dt;

            // Compute air friction drag limits
            playerVelocity.x *= Math.pow(FRICTION_DRAG, dt * 60);
            playerVelocity.z *= Math.pow(FRICTION_DRAG, dt * 60);

            // Move player rig base
            xrGroup.position.addScaledVector(playerVelocity, dt);

            // --- Hand Physics Processing Loop ---
            controllers.forEach((controller) => {
                if (!controller.userData.isActive) return;

                const handPos = new THREE.Vector3();
                controller.getWorldPosition(handPos);

                const handVelocity = handPos.clone().sub(controller.userData.prevWorldPos).divideScalar(dt);

                // Floor Interaction Bounds Check
                if (handPos.y <= HAND_COLLIDER_RADIUS) {
                    if (handVelocity.y < 0) {
                        playerVelocity.y = -handVelocity.y * BOUNCE_FORCE;
                        playerVelocity.x += -handVelocity.x * 0.6;
                        playerVelocity.z += -handVelocity.z * 0.6;
                    }
                    const depthPenetration = HAND_COLLIDER_RADIUS - handPos.y;
                    xrGroup.position.y += depthPenetration;
                }

                // Dynamic Wall Pushing Framework Check (Iterates through your custom map data boundaries)
                collisionWalls.forEach((box) => {
                    if (box.containsPoint(handPos) || box.distanceToPoint(handPos) < HAND_COLLIDER_RADIUS) {
                        const boxCenter = new THREE.Vector3();
                        box.getCenter(boxCenter);
                        
                        const pushDirection = handPos.clone().sub(boxCenter);
                        pushDirection.y = 0; 
                        pushDirection.normalize();

                        const pushStrength = handVelocity.dot(pushDirection);
                        if (pushStrength < 0) {
                            // Apply inverted momentum to launch the player away from the wall
                            playerVelocity.addScaledVector(pushDirection, -pushStrength * BOUNCE_FORCE);
                        }
                    }
                });

                controller.userData.prevWorldPos.copy(handPos);
            });

            // Ground safety fallback threshold check
            if (xrGroup.position.y < 0.1) {
                xrGroup.position.y = 0.1;
                if (playerVelocity.y < 0) playerVelocity.y = 0;
            }
        }

        function synchronizeMonkeyBones() {
            if (!monkeyModel || !monkeyBones.body) return;

            const headPos = new THREE.Vector3();
            camera.getWorldPosition(headWorldPos);

            const headRot = new THREE.Quaternion();
            camera.getWorldQuaternion(headWorldRot);

            // Anchor character coordinate platform straight under head tracking
            monkeyModel.position.copy(headPos).add(new THREE.Vector3(0, -0.55, 0));
            monkeyModel.quaternion.copy(headRot);
            monkeyModel.rotation.x = 0;
            monkeyModel.rotation.z = 0;

            // Map wrist endpoints cleanly to VR tracked hand devices
            controllers.forEach((controller) => {
                if (!controller.userData.isActive) return;

                const cPos = new THREE.Vector3();
                controller.getWorldPosition(cPos);

                const targetWristBone = (controller.handedness === 'left') ? monkeyBones.leftWrist : monkeyBones.rightWrist;
                if (targetWristBone && targetWristBone.parent) {
                    targetWristBone.position.copy(targetWristBone.parent.worldToLocal(cPos.clone()));
Use code with caution.
}
});
}
function onWindowResize() {
camera.aspect = window.innerWidth / window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth, window.innerHeight);
}
const clock = new THREE.Clock();
function animate() {
const dt = clock.getDelta();
runGorillaPhysics(dt);
synchronizeMonkeyBones();
renderer.render(scene, camera);
}
