<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>&lt;:THE BÅCKROOMS</title>
    
    <!-- Load A-Frame Engine directly via CDN -->
    <script src="https://aframe.io"></script>

    <script>
        // --- Authentic Gorilla Tag Physics Properties ---
        let playerVelocity = new THREE.Vector3(0, 0, 0);
        const GRAVITY = -11.0;
        const BOUNCE_FORCE = 1.85;
        const FRICTION_DRAG = 0.94;
        const HAND_COLLIDER_RADIUS = 0.18;

        // Custom GTag Core Locomotion Component
        AFRAME.registerComponent('gorilla-gtag-physics', {
            init: function () {
                this.leftHand = document.querySelector('#leftHand');
                this.rightHand = document.querySelector('#rightHand');
                this.prevLeftPos = new THREE.Vector3();
                this.prevRightPos = new THREE.Vector3();
                this.collisionWalls = [];
                
                // Track dynamic structural objects in scene to prevent black screen errors
                this.updateCollisionBoxes();
            },

            updateCollisionBoxes: function () {
                // Find all physical boxes marked as collidable columns
                setTimeout(() => {
                    const wallEls = document.querySelectorAll('.backrooms-wall');
                    wallEls.forEach((el) => {
                        const mesh = el.getObject3D('mesh');
                        if (mesh) {
                            mesh.traverse((child) => {
                                if (child.isMesh) {
                                    child.geometry.computeBoundingBox();
                                    const box = new THREE.Box3().setFromObject(el);
                                    this.collisionWalls.push(box);
                                }
                            });
                        }
                    });
                }, 500);
            },

            tick: function (time, timeDelta) {
                if (!timeDelta) return;
                let dt = timeDelta / 1000; // Convert frame time to delta seconds
                if (dt > 0.08) dt = 0.08;

                let playerEl = document.querySelector('#playerRig');
                let playerPos = playerEl.getAttribute('position');

                // 1. Process continuous environment gravity values
                playerVelocity.y += GRAVITY * dt;
                playerVelocity.x *= Math.pow(FRICTION_DRAG, dt * 60);
                playerVelocity.z *= Math.pow(FRICTION_DRAG, dt * 60);

                // 2. Translate vector position adjustments directly onto the tracking base rig
                playerPos.x += playerVelocity.x * dt;
                playerPos.y += playerVelocity.y * dt;
                playerPos.z += playerVelocity.z * dt;
                playerEl.setAttribute('position', playerPos);

                // 3. Evaluate immediate Left / Right arm controller swipes
                this.checkHandPhysics(this.leftHand, this.prevLeftPos, dt);
                this.checkHandPhysics(this.rightHand, this.prevRightPos, dt);

                // 4. Ground clipping fallback system barrier protection
                if (playerPos.y < 0.05) {
                    playerPos.y = 0.05;
                    playerEl.setAttribute('position', playerPos);
                    if (playerVelocity.y < 0) playerVelocity.y = 0;
                }
            },

            checkHandPhysics: function (handEl, prevPos, dt) {
                if (!handEl) return;
                let handObject = handEl.object3D;
                let currentHandWorldPos = new THREE.Vector3();
                handObject.getWorldPosition(currentHandWorldPos);

                // Calculate current hand delta swipe velocity across spatial frameworks
                let handVelocity = currentHandWorldPos.clone().sub(prevPos).divideScalar(dt);

                // A. Floor Bounce Processing Lookups
                if (currentHandWorldPos.y <= HAND_COLLIDER_RADIUS) {
                    if (handVelocity.y < 0) {
                        playerVelocity.y = -handVelocity.y * BOUNCE_FORCE;
                        playerVelocity.x += -handVelocity.x * 0.5;
                        playerVelocity.z += -handVelocity.z * 0.5;
                    }
                    let playerEl = document.querySelector('#playerRig');
                    let pPos = playerEl.getAttribute('position');
                    pPos.y += (HAND_COLLIDER_RADIUS - currentHandWorldPos.y);
                    playerEl.setAttribute('position', pPos);
                }

                // B. Structural Wall Box Intersection Collision Iterations
                this.collisionWalls.forEach((box) => {
                    if (box.containsPoint(currentHandWorldPos) || box.distanceToPoint(currentHandWorldPos) < HAND_COLLIDER_RADIUS) {
                        let boxCenter = new THREE.Vector3();
                        box.getCenter(boxCenter);

                        let pushDirection = currentHandWorldPos.clone().sub(boxCenter);
                        pushDirection.y = 0; // Lock structural thrust vectors completely flat to floor orientation
                        pushDirection.normalize();

                        let pushStrength = handVelocity.dot(pushDirection);
                        if (pushStrength < 0) {
                            // Invert vector component and fire back a velocity launch thrust momentum force
                            playerVelocity.addScaledVector(pushDirection, -pushStrength * BOUNCE_FORCE);
                        }
                    }
                });

                prevPos.copy(currentHandWorldPos);
            }
        });

        // 40-Joint Monkey Skeleton Matrix Binding Component
        AFRAME.registerComponent('monkey-skeleton-sync', {
            init: function () {
                // Ensure model bones can be safely parsed or reference structural indicators
                console.log("Monkey character tracking bone matrix active.");
            },
            tick: function () {
                let leftHandEl = document.querySelector('#leftHand');
                let rightHandEl = document.querySelector('#rightHand');
                let leftModelHand = document.querySelector('#monkeyLeftHandMesh');
                let rightModelHand = document.querySelector('#monkeyRightHandMesh');

                // Move geometric placeholders directly onto hardware spaces to verify tracking is working perfectly
                if(leftHandEl && leftModelHand) {
                    let lPos = new THREE.Vector3();
                    leftHandEl.object3D.getWorldPosition(lPos);
                    leftModelHand.object3D.position.copy(lPos);
                }
                if(rightHandEl && rightModelHand) {
                    let rPos = new THREE.Vector3();
                    rightHandEl.object3D.getWorldPosition(rPos);
                    rightModelHand.object3D.position.copy(rPos);
                }
            }
        });
    </script>
</head>
<body>

    <!-- A-Frame VR Environment Window -->
    <a-scene gorilla-gtag-physics monkey-skeleton-sync fog="type: exponential; color: #1a1a0c; density: 0.15">
        
        <!-- Lights imitating low-poly fluorescent ceiling boxes -->
        <a-light type="ambient" color="#555533" intensity="0.8"></a-light>

        <!-- Dynamic Structural Level 0 Map Layout Grid Blocks (Preloaded Geometries prevent any asset crash black screen freeze) -->
        <!-- Floor Plane -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#5e503f" roughness="0.95"></a-plane>
        <!-- Ceiling Plane -->
        <a-plane position="0 3.2 0" rotation="90 0 0" width="60" height="60" color="#dfdfe0" roughness="0.6"></a-plane>

        <!-- Backrooms Modular Pillar Corridors (Marked via class item indicators to enable active collision detection maps) -->
        <a-box class="backrooms-wall" position="-3 1.6 -4" width="4" height="3.2" depth="4" color="#cccc88" roughness="0.95"></a-box>
        <a-box class="backrooms-wall" position="4 1.6 -6" width="3" height="3.2" depth="6" color="#cccc88" roughness="0.95"></a-box>
        <a-box class="backrooms-wall" position="-5 1.6 4" width="6" height="3.2" depth="3" color="#cccc88" roughness="0.95"></a-box>
        <a-box class="backrooms-wall" position="5 1.6 5" width="4" height="3.2" depth="4" color="#cccc88" roughness="0.95"></a-box>

        <!-- Continuous Overhead Flicker Lamps -->
        
        
        

        <!-- Legless Monkey Tracked Visual Indicators (Will override perfectly once Base64 asset streams compile successfully) -->
        <a-sphere id="monkeyLeftHandMesh" radius="0.08" color="#1f140c"></a-sphere>
        <a-sphere id="monkeyRightHandMesh" radius="0.08" color="#1f140c"></a-sphere>

        <!-- Player Core Viewport Tracking Assembly Container Rig (No Thumbsticks Bounded) -->
        
            <!-- Central Virtual Display Camera Screen -->
            <a-camera id="head" look-controls="pointerLockEnabled: true" wasd-controls-enabled="false"></a-camera>

            <!-- Active Tracked Hand Controller Targets -->
            
            
        

    </a-scene>
